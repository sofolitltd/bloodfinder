name: bloodfinder
description: "Donate blood, Save life"
publish_to: 'none'

version: 1.0.0+5

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  cupertino_icons: ^1.0.9

  firebase_core: ^4.10.0
  cloud_firestore: ^6.5.0
  firebase_auth: ^6.5.2
  firebase_storage: ^13.4.2

  go_router: ^17.3.0
  google_fonts: ^8.1.0

  flutter_riverpod: ^3.1.0
  riverpod_annotation: ^4.0.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^13.1.0

  firebase_messaging: ^16.3.0
  flutter_local_notifications: ^22.0.0
  path_provider: ^2.1.5
  googleapis_auth: ^2.3.1

  in_app_update: ^4.2.3
  flutter_image_compress: ^2.4.0
  image_picker: ^1.2.2
  cached_network_image: ^3.4.1
  fluttertoast: ^9.1.0
  app_links: ^7.1.1
  phosphoricons_flutter: ^1.0.0
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^14.0.2
  country_state_city_selector: ^1.0.5
  gal: ^2.3.2
  flutter_screenutil: ^5.9.3
  flutter_contacts: ^1.1.9+2
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  riverpod_generator: ^4.0.0+1
  custom_lint: ^0.8.0
  riverpod_lint: ^3.1.0
  build_runner: ^2.15.0
  freezed: ^3.1.0
  json_serializable: ^6.9.5
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
    android: "ic_launcher"
    image_path: "assets/images/logo.png"
    min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/logo.png
    - assets/data/bloodfinder.json
